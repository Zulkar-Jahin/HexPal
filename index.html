<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HueKit — color palette generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="brandDot"></span>
    <h1>Hue<em>Kit</em></h1>
    <span class="tag" id="modeTag">single-color palette generator</span>
  </header>

  <div class="modes" role="tablist" aria-label="Palette mode">
    <button type="button" role="tab" aria-selected="true" class="on" data-mode="single" id="modeSingle">Single color</button>
    <button type="button" role="tab" aria-selected="false" data-mode="duo" id="modeDuo">Two colors</button>
  </div>

  <div class="bar">
    <div class="color-slot">
      <input type="text" id="colorInput" value="#c17440" aria-label="First color"
             placeholder="#c17440  /  rgb(193,116,64)" spellcheck="false">
      <input type="color" id="picker" value="#c17440" aria-label="Pick first color">
    </div>
    <div class="color-slot hidden" id="slotB">
      <input type="text" id="colorInputB" value="#111111" aria-label="Second color"
             placeholder="#111111  /  rgb(17,17,17)" spellcheck="false">
      <input type="color" id="pickerB" value="#111111" aria-label="Pick second color">
    </div>
    <button type="button" class="primary" id="goBtn">Generate</button>
    <button type="button" id="randBtn">Random</button>
    <button type="button" id="copyAll">Copy CSS</button>
  </div>
  <div id="err" role="status" aria-live="polite"></div>

  <div class="base" id="baseCard"></div>
  <div id="palettes"></div>

  <footer id="hint">Click on any swatch to copy the hex code.</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
