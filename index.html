<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HueKit — single color palette generator</title>
<style>
  :root{
    --bg:#faf8f5; --ink:#1a1816; --muted:#8a8178; --line:#e4ded6; --card:#fff;
    --accent:#c17440;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:28px 20px 80px; line-height:1.5;
  }
  .wrap{max-width:1020px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;margin-bottom:34px}
  .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);
       box-shadow:0 0 0 1px rgba(0,0,0,.08) inset;transition:background .25s}
  h1{font-size:19px;letter-spacing:-.4px;font-weight:650}
  h1 em{font-style:normal;color:var(--muted);font-weight:450}
  .tag{margin-left:auto;font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  #colorInput{
    flex:1 1 230px;min-width:0;padding:12px 14px;font-size:15px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);
    outline:none;transition:border-color .15s;
  }
  #colorInput:focus{border-color:var(--accent)}
  #picker{width:46px;height:45px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
  button{
    padding:12px 16px;font-size:14px;font-weight:550;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.15s;
  }
  button:hover{border-color:var(--ink)}
  button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button.primary:hover{opacity:.85}
  #err{color:#b3261e;font-size:13px;min-height:19px;margin-bottom:18px}

  .base{display:flex;flex-wrap:wrap;gap:18px;align-items:center;
        background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:34px}
  .base .big{width:92px;height:92px;border-radius:11px;box-shadow:0 0 0 1px rgba(0,0,0,.07) inset}
  .meta{display:flex;flex-wrap:wrap;gap:10px 26px}
  .meta div{min-width:120px}
  .meta span{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .meta b{font-family:ui-monospace,monospace;font-size:14px;font-weight:550}

  .group{margin-bottom:30px}
  .group h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
            font-weight:600;margin-bottom:10px}
  .row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
  .sw{border:none;padding:0;border-radius:11px;overflow:hidden;background:var(--card);
      border:1px solid var(--line);cursor:pointer;text-align:left;transition:transform .12s}
  .sw:hover{transform:translateY(-3px)}
  .sw .chip{height:74px;display:block}
  .sw .lbl{padding:8px 10px 9px;display:block}
  .sw .lbl b{display:block;font-family:ui-monospace,monospace;font-size:12.5px;font-weight:550;text-transform:uppercase}
  .sw .lbl i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:1px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.22s;font-family:ui-monospace,monospace}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  footer{margin-top:40px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="brandDot"></span>
    <h1>Hue<em>Kit</em></h1>
    <span class="tag">single-color palette generator</span>
  </header>

  <div class="bar">
    <input id="colorInput" value="#c17440" placeholder="#c17440  /  c17440  /  rgb(193,116,64)" spellcheck="false">
    <input type="color" id="picker" value="#c17440">
    <button class="primary" id="goBtn">Generate</button>
    <button id="randBtn">Random</button>
    <button id="copyAll">Copy CSS</button>
  </div>
  <div id="err"></div>

  <div class="base" id="baseCard"></div>
  <div id="palettes"></div>

  <footer>Click on any swatch to copy the hex code.</footer>
</div>
<div id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const input=$('#colorInput'), picker=$('#picker'), err=$('#err'),
        baseCard=$('#baseCard'), out=$('#palettes'), toast=$('#toast'), dot=$('#brandDot');
  let scaleForCss=[];

  /* ---------- parsing & conversion ---------- */
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

  function parseColor(str){
    if(!str) return null;
    let s=str.trim().toLowerCase();
    let m=s.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/);
    if(m){
      let h=m[1];
      if(h.length===3) h=h.split('').map(c=>c+c).join('');
      return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
    }
    m=s.match(/^(?:rgba?\s*)?\(?\s*(\d{1,3})\s*[, ]\s*(\d{1,3})\s*[, ]\s*(\d{1,3})\s*[,)]?/);
    if(m){
      const r=+m[1],g=+m[2],b=+m[3];
      if([r,g,b].some(v=>v>255)) return null;
      return {r,g,b};
    }
    return null;
  }
  const toHex=c=>'#'+[c.r,c.g,c.b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');

  function rgbToHsl({r,g,b}){
    r/=255;g/=255;b/=255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
    let h=0,s=0,l=(mx+mn)/2;
    if(d){
      s=l>.5? d/(2-mx-mn) : d/(mx+mn);
      if(mx===r) h=((g-b)/d+(g<b?6:0));
      else if(mx===g) h=((b-r)/d+2);
      else h=((r-g)/d+4);
      h*=60;
    }
    return {h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};
  }
  function hslToRgb({h,s,l}){
    h=((h%360)+360)%360; s=clamp(s,0,100)/100; l=clamp(l,0,100)/100;
    const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
    let p=[0,0,0];
    if(h<60)p=[c,x,0];else if(h<120)p=[x,c,0];else if(h<180)p=[0,c,x];
    else if(h<240)p=[0,x,c];else if(h<300)p=[x,0,c];else p=[c,0,x];
    return {r:Math.round((p[0]+m)*255),g:Math.round((p[1]+m)*255),b:Math.round((p[2]+m)*255)};
  }
  const mix=(c,t,a)=>({r:c.r+(t.r-c.r)*a, g:c.g+(t.g-c.g)*a, b:c.b+(t.b-c.b)*a});
  const shiftHue=(hsl,deg)=>hslToRgb({h:hsl.h+deg,s:hsl.s,l:hsl.l});

  function lum({r,g,b}){
    const f=v=>{v/=255;return v<=0.03928? v/12.92 : Math.pow((v+.055)/1.055,2.4);};
    return .2126*f(r)+.7152*f(g)+.0722*f(b);
  }
  const contrast=(a,b)=>{const L1=lum(a),L2=lum(b);return ((Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05));};
  const readable=c=>contrast(c,{r:255,g:255,b:255})>=contrast(c,{r:17,g:17,b:17})?'#ffffff':'#111111';

  /* ---------- rendering ---------- */
  function swatch(rgb,label){
    const hex=toHex(rgb), hsl=rgbToHsl(rgb);
    const b=document.createElement('button');
    b.className='sw';
    b.innerHTML=`<span class="chip" style="background:${hex}"></span>
      <span class="lbl"><b>${hex}</b><i>${label} · ${rgb.r|0},${rgb.g|0},${rgb.b|0}</i></span>`;
    b.onclick=()=>copy(hex, hex+' copied');
    return b;
  }
  function group(title, items){
    const g=document.createElement('div'); g.className='group';
    const h=document.createElement('h2'); h.textContent=title; g.appendChild(h);
    const row=document.createElement('div'); row.className='row';
    items.forEach(([rgb,lab])=>row.appendChild(swatch(rgb,lab)));
    g.appendChild(row); out.appendChild(g);
  }

  function render(rgb){
    const hex=toHex(rgb), hsl=rgbToHsl(rgb);
    document.documentElement.style.setProperty('--accent',hex);
    picker.value=hex;
    const cw=contrast(rgb,{r:255,g:255,b:255}), cb=contrast(rgb,{r:17,g:17,b:17});

    baseCard.innerHTML=`
      <div class="big" style="background:${hex}"></div>
      <div class="meta">
        <div><span>Hex</span><b>${hex.toUpperCase()}</b></div>
        <div><span>RGB</span><b>${rgb.r}, ${rgb.g}, ${rgb.b}</b></div>
        <div><span>HSL</span><b>${hsl.h}°, ${hsl.s}%, ${hsl.l}%</b></div>
        <div><span>vs White</span><b>${cw.toFixed(2)}:1</b></div>
        <div><span>vs Black</span><b>${cb.toFixed(2)}:1</b></div>
        <div><span>Best text</span><b>${readable(rgb).toUpperCase()}</b></div>
      </div>`;

    out.innerHTML='';
    const W={r:255,g:255,b:255}, B={r:0,g:0,b:0}, G={r:128,g:128,b:128};

    group('Tints — white mix',  [.15,.3,.45,.6,.75,.9].map(a=>[mix(rgb,W,a), (a*100)+'% white']));
    group('Shades — black mix', [.15,.3,.45,.6,.75,.9].map(a=>[mix(rgb,B,a), (a*100)+'% black']));
    group('Tones — gray mix',   [.15,.3,.45,.6,.75].map(a=>[mix(rgb,G,a), (a*100)+'% gray']));

    const steps=[['50',95],['100',90],['200',80],['300',68],['400',56],
                 ['500',hsl.l],['600',Math.max(hsl.l-12,8)],['700',Math.max(hsl.l-24,6)],
                 ['800',Math.max(hsl.l-34,5)],['900',Math.max(hsl.l-44,4)]];
    scaleForCss=steps.map(([n,l])=>[n,toHex(hslToRgb({h:hsl.h,s:hsl.s,l}))]);
    group('Scale 50 → 900', steps.map(([n,l])=>[hslToRgb({h:hsl.h,s:hsl.s,l}), n]));

    group('Harmony', [
      [rgb,'base'],
      [shiftHue(hsl,180),'complement'],
      [shiftHue(hsl,30),'analogous +30'],
      [shiftHue(hsl,-30),'analogous −30'],
      [shiftHue(hsl,120),'triadic +120'],
      [shiftHue(hsl,240),'triadic +240'],
      [shiftHue(hsl,150),'split +150'],
      [shiftHue(hsl,210),'split +210'],
      [shiftHue(hsl,90),'tetradic +90'],
      [shiftHue(hsl,270),'tetradic +270'],
    ]);
  }

  /* ---------- actions ---------- */
  function copy(text,msg){
    const done=()=>{toast.textContent=msg;toast.classList.add('on');
      clearTimeout(copy._t);copy._t=setTimeout(()=>toast.classList.remove('on'),1400);};
    try{
      navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
    }catch(e){ fallback(text,done); }
  }
  function fallback(text,done){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');done();}catch(e){}
    document.body.removeChild(ta);
  }

  function go(){
    const rgb=parseColor(input.value);
    if(!rgb){ err.textContent='Bujhte parlam na. Try: #c17440 or rgb(193,116,64)'; return; }
    err.textContent=''; render(rgb);
  }

  $('#goBtn').onclick=go;
  input.addEventListener('input',()=>{ if(parseColor(input.value)) go(); });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  picker.addEventListener('input',()=>{ input.value=picker.value; go(); });
  $('#randBtn').onclick=()=>{
    const c=hslToRgb({h:Math.floor(Math.random()*360),s:35+Math.random()*50,l:30+Math.random()*35});
    input.value=toHex(c); go();
  };
  $('#copyAll').onclick=()=>{
    if(!scaleForCss.length) return;
    const css=':root{\n'+scaleForCss.map(([n,h])=>`  --brand-${n}: ${h};`).join('\n')+'\n}';
    copy(css,'CSS variables copied');
  };

  go();
})();
</script>
</body>
</html>
